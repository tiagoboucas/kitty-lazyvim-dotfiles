# ~/.config/alacritty/alacritty.toml  (symlinked from ~/dotfiles/alacritty/)
#
# Omarchy look on macOS. Colours come from ./themes/tokyo-night.toml.
# No tabs — Alacritty has none. `tmux` is installed if you want them manually.

general.import = ["~/.config/alacritty/themes/tokyo-night.toml"]

[env]
TERM = "xterm-256color"

# Colours come entirely from themes/tokyo-night.toml, which is 1:1 with
# basecamp/omarchy → themes/tokyo-night/colors.toml. (Earlier there was a blue
# foreground / white / bright-white override here — removed so the text matches
# a real Omarchy terminal.)

[terminal]
osc52 = "CopyPaste"

# ---------------------------------------------------------------------------
# Font — pinned so a fresh machine renders identically.
#   family : FiraCode Nerd Font Mono   (Brewfile: cask "font-fira-code-nerd-font")
#   size   : 11
#   weight : Alacritty has no weight knob — the "solid" look is macOS font
#            smoothing. install.sh runs:
#              defaults write org.alacritty AppleFontSmoothing -int 2
#            Change that int (0 = off/thinnest … 3 = heaviest) to adjust weight.
# FiraCode ships no italic face, so italics render upright by design.
# ---------------------------------------------------------------------------
[font]
size = 11
normal      = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold        = { family = "FiraCode Nerd Font Mono", style = "Bold" }
italic      = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold_italic = { family = "FiraCode Nerd Font Mono", style = "Bold" }

[window]
padding.x = 14
padding.y = 6
# "Full" = a normal opaque macOS title bar. Alacritty then insets the grid below
# the bar automatically, so text can NEVER render under the title bar / tab strip
# (the recurring overlap). Trade-off vs the old "Transparent": the bar is the
# standard dark macOS chrome instead of being tinted with the background colour.
# To go back to the tinted look: decorations = "Transparent" + padding.y = 44
# (and re-check the top gap after macOS updates).
decorations = "Full"
decorations_theme_variant = "Dark"
# See-through so the wallpaper reads behind text, but blur OFF — blur is what
# made it look smeared/distorted. Lower = more wallpaper, higher = more solid.
opacity = 0.82
blur = false
option_as_alt = "None"   # hand Option back to macOS so Option+e e -> é works

[keyboard]
bindings = [
  # Send Shift+Return / Alt+Shift+Return as CSI-u so TUIs can tell
  # them apart from a plain Return.
  { key = "Return", mods = "Shift",     chars = "\u001B[13;2u" },
  { key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" },
  { key = "Insert", mods = "Shift",   action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy"  },
  # No native tabs. Alacritty's CreateNewTab (bound to Cmd+T by default) has an
  # upstream bug: the new tab attaches to the FIRST window, not the focused one,
  # so Cmd+T after Cmd+N dumps you back in the old window. No config fixes which
  # window it targets, so both Cmd+N and Cmd+T just open a fresh window that
  # comes up focused/foreground.
  { key = "N", mods = "Command", action = "CreateNewWindow" },
  { key = "T", mods = "Command", action = "CreateNewWindow" },
]
