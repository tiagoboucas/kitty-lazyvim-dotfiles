# vim:ft=kitty
# ─────────────────────────────────────────────────────────────────────────────
# griffin — kitty colors derived from griffin.nvim's palette.lua
# (Material Oceanic family). Same colors as the editor, so nvim and the
# shell look like one single surface.
# Switch back to Tokyo Night: swap the `include` line in kitty.conf.
# ─────────────────────────────────────────────────────────────────────────────

background            #1a191e
foreground            #eeffff
selection_background   #395f65
selection_foreground   #faffff
cursor                #89ddff
cursor_text_color      #1a191e
url_color             #82aaff

# Tabs
active_tab_background   #609bb3
active_tab_foreground   #1a191e
inactive_tab_background #26252b
inactive_tab_foreground #6f7275
tab_bar_background      #16151a

# Windows
active_border_color   #609bb3
inactive_border_color #375866
bell_border_color     #f89406

# normal
color0 #202020
color1 #f07178
color2 #c3e88d
color3 #ffcb6b
color4 #82aaff
color5 #c792ea
color6 #89ddff
color7 #b6c2c9

# bright
color8  #5f5e62
color9  #ff8b92
color10 #d5f5a3
color11 #f89406
color12 #a3c0ff
color13 #ddb0f5
color14 #a8e8ff
color15 #faffff

# extended (ANSI 16/17 — used by some themes for orange/dark red)
color16 #f78c6c
color17 #9b2231
